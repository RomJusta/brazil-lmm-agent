[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brazil-lmm-agent"
version = "0.1.0"
description = "Scraping agent for lower middle market companies in Brazil"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "playwright>=1.44",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "gspread>=6.0",
    "google-auth>=2.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/brazil_lmm"]
