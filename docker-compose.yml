version: "3.9"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://lmm:lmm@db:5432/lmm
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lmm
      POSTGRES_PASSWORD: lmm
      POSTGRES_DB: lmm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lmm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
